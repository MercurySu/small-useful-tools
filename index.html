<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MercurySu 的实用在线小工具集合">
  <title>Small Useful Tools · MercurySu</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1120; color: #f3f6fd; }
    main { width: min(100% - 40px, 850px); margin: 0 auto; padding: 88px 0; }
    .eyebrow { color: #87a8e9; letter-spacing: .18em; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 7vw, 56px); letter-spacing: -.04em; margin: 12px 0 10px; }
    .intro { color: #aab9d4; line-height: 1.8; margin-bottom: 40px; }
    .card { display: block; max-width: 530px; text-decoration: none; color: inherit; background: linear-gradient(125deg, #16233e, #11192c); border: 1px solid #334565; border-radius: 18px; padding: 28px; transition: transform .15s, border-color .15s; }
    .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: #80c8ff; outline: none; }
    .card h2 { margin: 0 0 10px; font-size: 22px; }
    .card p { margin: 0 0 20px; color: #b3c2db; line-height: 1.7; }
    .card span { color: #90ccff; font-weight: 600; }
    footer { color: #7d8eaa; font-size: 13px; padding-top: 50px; }
    footer a { color: #9bbff5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">MercurySu / Toolkit</div>
    <h1>Small Useful Tools</h1>
    <p class="intro">一些简单实用的小工具。无需安装，直接在浏览器中使用。</p>
    <a class="card" href="./color-light.html">
      <h2>色光 · 全屏颜色盘</h2>
      <p>自由选择颜色，一键让整个屏幕变成纯色光源。</p>
      <span>打开工具 →</span>
    </a>
    <footer>Made by MercurySu · <a href="https://github.com/MercurySu/small-useful-tools">View on GitHub</a></footer>
  </main>
</body>
</html>
